<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>創作辞典</title>
<meta name="description" content="かんたとゆうこの、言葉の単語帳と創作ネタ帳">
<meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="創作辞典">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4efe6; --paper-2:#ebe4d6; --card:#fbf8f2; --ink:#1d1a16; --ink-2:#5b544a; --ink-3:#958b7c;
  --line:#d9d0bf; --shu:#c8402a; --shu-soft:#f3d9d0; --ai:#2f4a6d; --ai-soft:#dde5ef; --matcha:#5d7a3a;
  --shadow:0 1px 0 rgba(0,0,0,.04),0 8px 24px -12px rgba(60,40,10,.18);
  --mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --gothic:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#16130f; --paper-2:#1f1b16; --card:#211d18; --ink:#efe8db; --ink-2:#b9ae9c; --ink-3:#7d7366;
    --line:#383128; --shu:#e5654c; --shu-soft:#3a211b; --ai:#8fb0d8; --ai-soft:#1f2a37; --matcha:#9cbf6e;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#16130f; --paper-2:#1f1b16; --card:#211d18; --ink:#efe8db; --ink-2:#b9ae9c; --ink-3:#7d7366;
  --line:#383128; --shu:#e5654c; --shu-soft:#3a211b; --ai:#8fb0d8; --ai-soft:#1f2a37; --matcha:#9cbf6e;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--gothic);font-size:15px;line-height:1.75;
  background-image:radial-gradient(rgba(120,90,40,.05) 1px,transparent 1px);background-size:4px 4px;}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}

/* header */
header.top{padding:28px 0 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.hanko{width:44px;height:44px;border-radius:8px;background:var(--shu);color:#fff;display:grid;place-items:center;
  font-family:var(--mincho);font-weight:800;font-size:22px;transform:rotate(-4deg);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.brand h1{margin:0;font-family:var(--mincho);font-weight:800;font-size:28px;letter-spacing:.12em;line-height:1}
.brand small{display:block;color:var(--ink-3);font-size:11px;letter-spacing:.2em;margin-top:6px}
.stat{text-align:right;font-size:12px;color:var(--ink-2);line-height:1.4}
.stat b{font-family:var(--mincho);font-size:22px;color:var(--ink);font-weight:800}
.themebtn{border:1px solid var(--line);background:transparent;border-radius:99px;width:34px;height:34px;margin-left:8px;color:var(--ink-2)}

/* today */
.today{margin:18px 0 8px;position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 20px 18px 92px;
  box-shadow:var(--shadow);overflow:hidden;min-height:150px;cursor:pointer}
.today .tate{position:absolute;left:18px;top:16px;bottom:16px;writing-mode:vertical-rl;font-family:var(--mincho);font-weight:800;
  font-size:30px;letter-spacing:.08em;color:var(--ink);border-left:2px solid var(--shu);padding-left:8px;overflow:hidden;line-height:1.15}
.today .lbl{font-size:11px;letter-spacing:.24em;color:var(--shu);font-weight:700}
.today .yomi{color:var(--ink-3);font-size:13px}
.today p{margin:6px 0 0}
.today .ex{color:var(--ink-2);font-size:13px;margin-top:8px}
.today .ex::before{content:"「";}.today .ex::after{content:"」";}

/* search */
.search{position:sticky;top:0;z-index:5;background:linear-gradient(var(--paper) 78%,transparent);padding:14px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px}
.sbox{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:0 12px;transition:border-color .2s}
.sbox:focus-within{border-color:var(--ink)}
.sbox svg{flex:none;color:var(--ink-3)}
.sbox input{flex:1;border:0;background:transparent;padding:13px 0;outline:none;font-size:16px}
.sbox .clear{border:0;background:var(--paper-2);border-radius:99px;width:24px;height:24px;font-size:12px;display:none}
.hint{font-size:12px;color:var(--ink-3);margin:6px 2px 0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.shu[aria-pressed="true"]{background:var(--shu);border-color:var(--shu);color:#fff}
.row2{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--ink-3)}
.row2 select{font:inherit;font-size:12px;color:var(--ink-2);background:transparent;border:0;padding:4px}

/* list */
.list{list-style:none;margin:6px 0 0;padding:0}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 4px;border-bottom:1px dashed var(--line);cursor:pointer;align-items:start}
.item:hover .w{color:var(--shu)}
.item .w{font-family:var(--mincho);font-weight:700;font-size:20px;line-height:1.35;transition:color .15s}
.item .w small{font-family:var(--gothic);font-weight:400;font-size:12px;color:var(--ink-3);margin-left:8px}
.item .m{grid-column:1/2;color:var(--ink-2);font-size:13.5px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .side{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.tag{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--paper-2);color:var(--ink-2);white-space:nowrap}
.tag.by-yuko{background:var(--ai-soft);color:var(--ai)}
.heat{display:flex;gap:3px}
.heat i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.heat i.on{background:var(--shu)}
.why{font-size:11px;color:var(--matcha);margin-top:2px;grid-column:1/2}
.empty{text-align:center;color:var(--ink-3);padding:48px 0;font-family:var(--mincho)}
.more{display:block;margin:18px auto;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 22px;font-size:13px;color:var(--ink-2)}
mark{background:linear-gradient(transparent 60%,var(--shu-soft) 60%);color:inherit}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,15,10,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;z-index:21;
  transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding:10px 20px calc(28px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.sheet.open{transform:none}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 14px}
.d-head{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
.d-tate{writing-mode:vertical-rl;font-family:var(--mincho);font-weight:800;font-size:40px;line-height:1.1;letter-spacing:.06em;
  padding:6px 10px 6px 6px;border-right:3px solid var(--shu);max-height:46vh}
.d-yomi{color:var(--ink-3);font-size:13px;letter-spacing:.1em}
.d-mean{font-size:17px;line-height:1.75;margin:4px 0 10px;font-family:var(--mincho);font-weight:500}
.d-tags{display:flex;flex-wrap:wrap;gap:6px}
.d-sec{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.d-sec h4{margin:0 0 4px;font-size:11px;letter-spacing:.22em;color:var(--shu)}
.d-sec p{margin:0}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.kw button{border:1px dashed var(--ink-3);background:transparent;border-radius:99px;padding:2px 10px;font-size:12.5px;color:var(--ink-2)}
.d-acts{display:flex;gap:8px;margin-top:20px}
.btn{flex:1;border:1.5px solid var(--ink);background:transparent;border-radius:12px;padding:10px;font-weight:700;font-size:14px}
.btn.fill{background:var(--ink);color:var(--paper)}
.btn.on{background:var(--shu);border-color:var(--shu);color:#fff}

/* tabs */
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:10;display:flex;gap:4px;
  background:var(--ink);padding:5px;border-radius:99px;box-shadow:0 10px 30px -8px rgba(0,0,0,.45)}
nav.tabs button{border:0;background:transparent;color:var(--paper);opacity:.6;padding:9px 16px;border-radius:99px;font-size:13px;font-weight:700;letter-spacing:.06em;display:flex;gap:6px;align-items:center}
nav.tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink);opacity:1}
.view[hidden]{display:none}

/* quiz */
.qhead{padding:26px 0 6px}
.qhead h2,.sec-title{font-family:var(--mincho);font-weight:800;font-size:24px;margin:0;letter-spacing:.08em}
.qhead p{color:var(--ink-2);margin:4px 0 0;font-size:13px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.mode{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.mode b{display:block;font-family:var(--mincho);font-size:18px}
.mode span{font-size:12px;color:var(--ink-2)}
.mode .num{position:absolute;right:10px;bottom:-14px;font-family:var(--mincho);font-weight:800;font-size:64px;color:var(--paper-2);z-index:0}
.mode b,.mode span{position:relative;z-index:1}
.mode.wide{grid-column:1/-1}
.qtype{display:flex;gap:6px;margin-top:14px}
.qcard{margin-top:18px}
.qprog{display:flex;gap:4px;margin-bottom:16px}
.qprog i{flex:1;height:4px;border-radius:9px;background:var(--line)}
.qprog i.ok{background:var(--matcha)}.qprog i.ng{background:var(--shu)}.qprog i.now{background:var(--ink)}
.qq{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 20px;text-align:center;box-shadow:var(--shadow)}
.qq .lbl{font-size:11px;letter-spacing:.24em;color:var(--ink-3)}
.qq .big{font-family:var(--mincho);font-weight:800;font-size:34px;line-height:1.35;margin:8px 0 0}
.qq .mid{font-family:var(--mincho);font-weight:500;font-size:17px;line-height:1.7;margin:10px 0 0;text-align:left}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:1.55;transition:transform .1s}
.opt:active{transform:scale(.99)}
.opt.w{font-family:var(--mincho);font-weight:700;font-size:18px}
.opt.ok{border-color:var(--matcha);background:color-mix(in srgb,var(--matcha) 14%,var(--card))}
.opt.ng{border-color:var(--shu);background:var(--shu-soft)}
.qnext{margin-top:14px;width:100%}
.result{text-align:center;padding:30px 0 10px}
.score{font-family:var(--mincho);font-weight:800;font-size:72px;line-height:1}
.score small{font-size:22px;color:var(--ink-3)}
.miss{margin-top:18px}

.qdesc{font-size:12.5px;color:var(--ink-2);margin:8px 2px 0}
.typer{margin-top:14px;display:grid;gap:10px}
.typer input,.typer textarea{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:14px;font-size:18px;font-family:var(--mincho);outline:none;resize:none;line-height:1.5}
.typer textarea{font-family:var(--gothic);font-size:16px}
.typer input:focus,.typer textarea:focus{border-color:var(--ink)}
.trow{display:flex;gap:8px}.trow .btn.fill{flex:1.6}
.btn.ghost{border-color:var(--line);color:var(--ink-2);font-weight:500}
.btn:disabled{opacity:.45}
.hintbox{font-size:13px;color:var(--ai);background:var(--ai-soft);border-radius:10px;padding:8px 12px}
.yomi-s{color:var(--ink-3);font-size:13px;margin-top:2px}
.qq.ans{margin-top:14px;text-align:left;padding:16px 18px;border-left:4px solid var(--line)}
.qq.ans.is-ok{border-left-color:var(--matcha)}.qq.ans.is-ng{border-left-color:var(--shu)}
.qq.ans .lbl{color:var(--ink-2)}.qq.ans.is-ok .lbl{color:var(--matcha)}.qq.ans.is-ng .lbl{color:var(--shu)}
.aw{font-family:var(--mincho);font-weight:700;font-size:20px;margin-top:4px}.aw small{font-family:var(--gothic);font-size:12px;color:var(--ink-3);font-weight:400}
.am{font-size:14px;margin-top:2px}.aex{font-size:13px;color:var(--ink-2);margin-top:4px}
.yours{font-size:13px;color:var(--ink-2);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.self{display:flex;gap:8px;margin-top:12px}
.omean{display:block;font-family:var(--gothic);font-weight:400;font-size:12px;color:var(--ink-3);margin-top:4px;line-height:1.5}
/* idea */
.idea{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 18px;box-shadow:var(--shadow)}
.idea .three{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
.idea .three button{border:0;background:transparent;font-family:var(--mincho);font-weight:800;font-size:26px;padding:4px 10px;border-bottom:2px solid var(--shu)}
.idea .prompt{font-size:13px;color:var(--ink-2);text-align:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stats b{display:block;font-family:var(--mincho);font-size:26px;font-weight:800;line-height:1.2}
.stats span{font-size:11px;color:var(--ink-3);letter-spacing:.1em}
.bars{margin-top:14px;display:grid;gap:6px}
.bar{display:grid;grid-template-columns:7em 1fr 2.5em;gap:8px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.bar .t{height:8px;background:var(--paper-2);border-radius:9px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--ink)}
.bar b{text-align:right;font-weight:500}
.foot{color:var(--ink-3);font-size:11.5px;text-align:center;margin-top:30px;line-height:1.7}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-80px);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:99px;font-size:13px;z-index:40;transition:transform .3s}
.toast.show{transform:translate(-50%,0)}
@media (min-width:640px){.modes{grid-template-columns:repeat(3,1fr)}.mode.wide{grid-column:auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

<!-- 辞典 -->
<section class="view" id="v-dict">
  <header class="top">
    <div class="brand"><div class="hanko">創</div><div><h1>創作辞典</h1><small>KANTA &amp; YUKO'S WORDBOOK</small></div></div>
    <div style="display:flex;align-items:center"><div class="stat"><b id="total">0</b> 語<br><span id="byline"></span></div>
    <button class="themebtn" id="themeBtn" aria-label="明るさを切り替える">◐</button></div>
  </header>

  <article class="today" id="today" aria-label="今日の一語"></article>

  <div class="search">
    <label class="sbox">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="text" placeholder="言葉でも、気持ちでも（例：さみしい）" autocomplete="off" enterkeyhint="search">
      <button class="clear" id="clear" aria-label="消す">✕</button>
    </label>
    <div class="chips" id="chipsWho"></div>
    <div class="chips" id="chipsGenre"></div>
    <div class="row2"><span id="count"></span>
      <select id="sort" aria-label="並べ方">
        <option value="kana">五十音順</option>
        <option value="weak">苦手な順</option>
        <option value="new">新しい順</option>
        <option value="rand">シャッフル</option>
      </select></div>
  </div>
  <ul class="list" id="list"></ul>
  <button class="more" id="more" hidden>もっと見る</button>
</section>

<!-- クイズ -->
<section class="view" id="v-quiz" hidden>
  <div id="quizHome">
    <div class="qhead"><h2>腕だめし</h2><p>1回10問。まちがえた言葉は、次から出やすくなるよ。</p></div>
    <p class="qdesc" id="qdesc"></p>
    <div class="qtype chips" id="qtype"></div>
    <div class="modes">
      <button class="mode" data-mode="rand"><b>ランダム</b><span>全部の言葉からまんべんなく</span><em class="num">10</em></button>
      <button class="mode" data-mode="weak"><b>苦手を克服</b><span>よく間違える・何度も書いた言葉</span><em class="num">苦</em></button>
      <button class="mode wide" data-mode="fav"><b>しおりの言葉</b><span>しおりを挟んだ言葉だけで</span><em class="num">栞</em></button>
    </div>
    <div class="stats" id="qstats"></div>
  </div>
  <div id="quizPlay" hidden></div>
</section>

<!-- ネタ帳 -->
<section class="view" id="v-idea" hidden>
  <div class="qhead"><h2 class="sec-title">ネタ帳</h2><p>3つの言葉を全部使って、短い文や場面を書いてみよう。</p></div>
  <div class="idea">
    <div class="three" id="three"></div>
    <div class="prompt" id="ideaPrompt"></div>
    <div class="d-acts"><button class="btn fill" id="reroll">ほかの3語</button></div>
  </div>
  <h3 class="sec-title" style="font-size:18px;margin-top:28px">この辞典のなかみ</h3>
  <div class="bars" id="bars"></div>
  <p class="foot">言葉は、Googleドキュメント「創作辞典」に書きためたものです。<br>意味・例文・分類はClaudeが付けています。おかしなところがあったら、かんたに教えてね。<br><span id="updated"></span></p>
</section>

</div>

<nav class="tabs" role="tablist">
  <button role="tab" aria-selected="true" data-v="dict">辞典</button>
  <button role="tab" aria-selected="false" data-v="quiz">クイズ</button>
  <button role="tab" aria-selected="false" data-v="idea">ネタ帳</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="言葉の詳しい説明"></div>
<div class="toast" id="toast"></div>

<script src="words.js"></script>
<script>
(() => {
const W = (window.WORDS || []).map((e, i) => ({...e, id: e.id ?? i}));
const META = window.META || {};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---- 保存（ブラウザごと） ----
const store = {
  get(k, d){ try { const v = localStorage.getItem('sj_' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem('sj_' + k, JSON.stringify(v)); } catch {} }
};
let favs = new Set(store.get('favs', []));
let hist = store.get('hist', {});          // id -> {ok, ng}
let log = store.get('log', {});            // 日付 -> 解いた数
const keyOf = e => e.w;                     // 言葉そのものを鍵にする（並び順が変わっても残る）

// ---- テーマ ----
const theme = store.get('theme', null);
if (theme) document.documentElement.dataset.theme = theme;

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

function expand(nq){
  const set = new Set([nq]);
  for (const g of SYN) if (g.some(w => w === nq || (nq.length >= 2 && w.startsWith(nq)))) g.forEach(w => set.add(w));
  return [...set];
}
let qx = [];
function match(e, q){
  if (!q) return {hit: true};
  const nq = norm(q);
  if (norm(e.w).includes(nq) || norm(e.r).includes(nq)) return {hit: true, rank: 0};
  const k = (e.k || []).find(k => qx.some(v => norm(k).includes(v) || (v.length >= 2 && v.includes(norm(k)))));
  if (k) return {hit: true, rank: 1, why: `「${k}」に近い言葉`};
  const mv = qx.find(v => v.length >= 2 && norm(e.mean).includes(v));
  if (mv) return {hit: true, rank: 2, why: '意味に「' + mv + '」'};
  if (norm(e.ex + e.use + e.tip).includes(nq)) return {hit: true, rank: 3, why: '例文や説明に出てくる'};
  return {hit: false};
}
let shuffled = null;
function filtered(){
  qx = state.q ? expand(norm(state.q)) : [];
  let r = [];
  for (const e of W) {
    if (state.who === 'fav' && !favs.has(keyOf(e))) continue;
    if ((state.who === '文語' || state.who === '口語') && e.s !== state.who) continue;
    if (!['all','fav','文語','口語'].includes(state.who) && !byOf(e).includes(state.who)) continue;
    if (state.genre !== 'all' && e.g !== state.genre && !(e.x || []).includes(state.genre)) continue;
    const m = match(e, state.q); if (!m.hit) continue;
    r.push({e, m});
  }
  const s = state.sort;
  if (s === 'kana') r.sort((a, b) => yomi(a.e).localeCompare(yomi(b.e), 'ja'));
  if (s === 'weak') r.sort((a, b) => weakScore(b.e) - weakScore(a.e));
  if (s === 'new') r.sort((a, b) => (b.e.added || '').localeCompare(a.e.added || '') || b.e.id - a.e.id);
  if (s === 'rand') { shuffled = shuffled || shuffle(W.map(e => e.id)); const pos = new Map(shuffled.map((id, i) => [id, i])); r.sort((a, b) => pos.get(a.e.id) - pos.get(b.e.id)); }
  if (state.q) r.sort((a, b) => (a.m.rank || 0) - (b.m.rank || 0));
  return r;
}
function hl(text, q){
  if (!q) return esc(text);
  const i = norm(text).indexOf(norm(q));
  if (i < 0 || norm(text).length !== text.replace(/[\s　・]/g,'').length) return esc(text);
  return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
}

// 出し方：write＝意味を見て言葉を書く／mean＝言葉を見て意味を書く／choice＝似た言葉の4択／mix
const QTYPES = [['write','言葉を書く'], ['mean','意味を書く'], ['choice','似た言葉の4択'], ['mix','まぜる']];
let qtype = store.get('qtype2', 'write');
const bigrams = s => { s = norm(s).replace(/[、。，．,.!！?？「」『』（）()〜~ー\-]/g, ''); const a = new Set(); for (let i = 0; i < s.length - 1; i++) a.add(s.slice(i, i + 2)); if (s.length === 1) a.add(s); return a; };
const MEANBG = new Map(W.map(e => [e.id, bigrams(e.mean)]));
const overlap = (a, b) => { let n = 0; a.forEach(x => b.has(x) && n++); return n; };

// 似た言葉を探す（4択のハズレ用）：キーワード・表現の種類・意味の文字の重なりで点をつける
function similar(e, n){
  const ks = new Set((e.k || []).map(norm)), mb = MEANBG.get(e.id);
  return W.filter(x => x !== e && x.mean && norm(x.w) !== norm(e.w))
    .map(x => {
      let s = 0;
      (x.k || []).forEach(k => { if (ks.has(norm(k))) s += 3; });
      (x.x || []).forEach(v => { if ((e.x || []).includes(v)) s += 1.5; });
      if (x.g === e.g) s += 1;
      if (x.s === e.s) s += .5;
      s += overlap(mb, MEANBG.get(x.id)) * .8;
      return {x, s};
    })
    .filter(o => overlap(mb, MEANBG.get(o.x.id)) / Math.max(mb.size, 1) < .75)  // ほぼ同じ意味の言葉は外す
    .sort((a, b) => b.s - a.s).slice(0, n).map(o => o.x);
}

// 書いた言葉の判定：漢字でも読みでもOK。1文字ちがいは「おしい」で正解
function lev(a, b){ const m = a.length, n = b.length; const d = Array.from({length: m + 1}, (_, i) => [i, ...Array(n).fill(0)]); for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1)); return d[m][n]; }
function judgeWord(e, ans){
  const a = norm(ans).replace(/[、。]/g, ''); if (!a) return {ok: false};
  const cands = [e.w, e.r, ...(e.memo.match(/「(.+?)」/g) || []).map(s => s.slice(1, -1))].filter(Boolean).map(norm);
  if (cands.includes(a)) return {ok: true, msg: 'せいかい'};
  if (cands.some(c => c.length >= 4 && lev(a, c) <= 1)) return {ok: true, msg: 'おしい！ほぼせいかい'};
  return {ok: false, msg: 'ざんねん'};
}
// 書いた意味の判定：言いかえ集（p）・キーワード・意味の文字の重なりで、ざっくり判定する
const STOP = new Set(['こと','する','して','ない','さま','よう','もの','てい','いる','った','れる','られ','です','ます','とい','いう','ある','なる','ので','から','ても','まま','ような','人が','人の','人を']);
const content = set => { const r = new Set(); set.forEach(x => STOP.has(x) || r.add(x)); return r; };
function judgeMean(e, ans){
  const a = norm(ans);
  if (a.length < 2) return {level: 0};
  if (a.includes(norm(e.w)) || (e.r && a.includes(norm(e.r)))) return {level: 0, note: '言葉そのものは使わずに説明してね'};
  const frags = [...new Set([...(e.p || []), ...(e.k || [])].map(norm))].filter(f => f.length >= 2);
  const hits = frags.filter(f => a.includes(f) || expand(f).some(v => v.length >= 2 && a.includes(v)));
  const ab = content(bigrams(ans));
  const target = content(new Set([...MEANBG.get(e.id), ...frags.flatMap(f => [...bigrams(f)])]));
  const ov = ab.size ? overlap(ab, target) / ab.size : 0;
  const level = (hits.length >= 2 || (hits.length && ov >= .25) || ov >= .5) ? 2 : (hits.length || ov >= .2) ? 1 : 0;
  return {level};
}

let Q = null;
function pickSet(mode){
  let pool = W.filter(e => e.mean);
  if (mode === 'fav') { pool = pool.filter(e => favs.has(keyOf(e))); if (pool.length < 4) { toast('しおりが4語以上いるよ'); return null; } }
  if (mode === 'weak') return pool.map(e => ({e, s: weakScore(e) + Math.random() * 1.5})).sort((a, b) => b.s - a.s).slice(0, 10).map(x => x.e);
  return shuffle(pool).slice(0, 10);
}

  const set = pickSet(mode); if (!set) return;
  Q = {set, i: 0, res: [], mode};
  $('#quizHome').hidden = true; $('#quizPlay').hidden = false; askQ();
}

function askQ(){
  const e = Q.set[Q.i];
  let t = qtype === 'mix' ? ['write', 'mean', 'choice'][Math.random() * 3 | 0] : qtype;
  const prog = Q.set.map((_, i) => `<i class="${i < Q.i ? (Q.res[i] ? 'ok' : 'ng') : i === Q.i ? 'now' : ''}"></i>`).join('');
  const head = `<div class="qhead"><h2>${Q.i + 1}<small style="font-size:14px;color:var(--ink-3)"> / ${Q.set.length}</small></h2></div><div class="qcard"><div class="qprog">${prog}</div>`;
  if (t === 'choice') {
    const opts = shuffle([e, ...shuffle(similar(e, 6)).slice(0, 3)]);
    $('#quizPlay').innerHTML = head + `<div class="qq"><div class="lbl">この意味の言葉は？</div><div class="mid">${esc(e.mean)}</div></div>
      <div class="opts">${opts.map(o => `<button class="opt w" data-id="${o.id}">${esc(o.w)}</button>`).join('')}</div><div id="after"></div></div>`;
    $('#quizPlay').querySelector('.opts').onclick = ev => {
      const b = ev.target.closest('.opt'); if (!b || Q.res[Q.i] !== undefined) return;
      const ok = +b.dataset.id === e.id; record(e, ok);
      $('#quizPlay').querySelectorAll('.opt').forEach(x => {
        const o = W[+x.dataset.id];
        if (+x.dataset.id === e.id) x.classList.add('ok'); else if (x === b) x.classList.add('ng');
        if (o !== e) x.insertAdjacentHTML('beforeend', `<span class="omean">${esc(o.mean)}</span>`);
      });
      $('#after').innerHTML = answerCard(e, ok, ok ? 'せいかい' : 'ざんねん'); nextBtn();
    };
    return;
  }
  const isW = t === 'write';
  $('#quizPlay').innerHTML = head + `<div class="qq">${isW
      ? `<div class="lbl">この意味の言葉を書いて</div><div class="mid">${esc(e.mean)}</div>`
      : `<div class="lbl">この言葉の意味を書いて</div><div class="big">${esc(e.w)}</div>${e.r ? `<div class="yomi-s">${esc(e.r)}</div>` : ''}`}</div>
    <form class="typer" id="typer" autocomplete="off">
      ${isW ? `<input id="ans" type="text" placeholder="漢字でも、ひらがなでも" enterkeyhint="done">`
            : `<textarea id="ans" rows="2" placeholder="だいたいの意味でOK（例：ぼんやりして広い）" enterkeyhint="done"></textarea>`}
      <div class="trow"><button type="button" class="btn ghost" id="hint">ヒント</button><button type="button" class="btn ghost" id="skip">わからない</button><button class="btn fill" type="submit">答える</button></div>
      <div class="hintbox" id="hintbox" hidden></div>
    </form><div id="after"></div></div>`;
  const inp = $('#ans'); setTimeout(() => inp.focus({preventScroll: true}), 50);
  let hinted = 0;
  $('#hint').onclick = () => {
    hinted++; const hb = $('#hintbox'); hb.hidden = false;
    if (isW) { const y = e.r || e.w; hb.textContent = hinted === 1 ? `${[...y].length}文字・「${[...y][0]}」から始まる` : `${[...y].slice(0, 2).join('')}…（${[...y].length}文字）`; }
    else hb.innerHTML = hinted === 1 ? `近いイメージ：${esc((e.k || []).slice(0, 2).join('、'))}` : `例文：${esc((e.ex || '').replace(e.w, '〇〇'))}`;
  };
  inp.addEventListener('keydown', ev => { if (ev.key === 'Enter' && !ev.isComposing && !ev.shiftKey) { ev.preventDefault(); $('#typer').requestSubmit(); } });
  const finish = () => { $('#typer').querySelectorAll('input,textarea,button').forEach(x => x.disabled = true); };
  $('#skip').onclick = () => { if (Q.res[Q.i] !== undefined) return; finish(); record(e, false); $('#after').innerHTML = answerCard(e, false, 'こたえ'); nextBtn(); };
  $('#typer').onsubmit = ev => {
    ev.preventDefault(); if (Q.res[Q.i] !== undefined) return;
    const ans = inp.value.trim(); if (!ans) { inp.focus(); return; }
    if (isW) {
      const j = judgeWord(e, ans); finish(); record(e, j.ok);
      $('#after').innerHTML = answerCard(e, j.ok, j.ok ? j.msg + (hinted ? '（ヒントあり）' : '') : `ざんねん（「${ans}」と書いた）`); nextBtn();
      return;
    }
    const j = judgeMean(e, ans); finish();
    const yours = `<div class="yours">あなたの答え：${esc(ans)}</div>`;
    if (j.level === 2) { record(e, true); $('#after').innerHTML = answerCard(e, true, 'だいたい合ってる！せいかい', yours); nextBtn(); return; }
    // 自動で決めきれないときは、正しい意味と見比べて自分で決める
    $('#after').innerHTML = answerCard(e, null, j.note || (j.level === 1 ? 'おしいかも？ 見比べて決めてね' : '意味とずれているかも。見比べて決めてね'), yours +
      `<div class="self"><button class="btn" data-ok="0">ちがってた</button><button class="btn fill" data-ok="1">合ってた</button></div>`);
    $('#after').querySelector('.self').onclick = ev2 => {
      const b = ev2.target.closest('button'); if (!b || Q.res[Q.i] !== undefined) return;
      const ok = b.dataset.ok === '1'; record(e, ok);
      const card = $('#after').querySelector('.ans'); card.classList.add(ok ? 'is-ok' : 'is-ng'); card.querySelector('.lbl').textContent = ok ? 'せいかい（自分で判定）' : 'ざんねん（自分で判定）';
      $('#after').querySelector('.self').remove(); nextBtn();
    };
  };
}
function showResult(){
  const n = Q.res.filter(Boolean).length;
  const msg = n === 10 ? '満点！言葉の達人だね' : n >= 8 ? 'いい調子。あと少し' : n >= 5 ? 'まずまず。間違えた言葉を見直そう' : '伸びしろしかない。もう1回いこう';
  const miss = Q.set.filter((_, i) => !Q.res[i]);
  $('#quizPlay').innerHTML = `<div class="result"><div class="lbl" style="font-size:11px;letter-spacing:.24em;color:var(--ink-3)">けっか</div>
    <div class="score">${n}<small> / ${Q.set.length}</small></div><p style="font-family:var(--mincho);font-size:17px">${msg}</p></div>
    ${miss.length ? `<div class="miss"><h4 style="font-size:11px;letter-spacing:.22em;color:var(--shu);margin:0 0 4px">まちがえた言葉</h4><ul class="list">${miss.map(e => `<li class="item" data-id="${e.id}"><div class="w">${esc(e.w)}<small>${esc(e.r)}</small></div><div class="side">${heat(e)}</div><div class="m">${esc(e.mean)}</div></li>`).join('')}</ul></div>` : ''}
    <div class="d-acts"><button class="btn" id="qHome">メニューへ</button><button class="btn fill" id="qAgain">もう1回</button></div>`;
  $('#quizPlay').querySelector('.list')?.addEventListener('click', ev => { const li = ev.target.closest('.item'); if (li) openSheet(W[+li.dataset.id]); });
  $('#qHome').onclick = quizHome; $('#qAgain').onclick = () => startQuiz(Q.mode);
}

// ---- ネタ帳 ----
function reroll(){
  const three = shuffle(W).slice(0, 3);
  $('#three').innerHTML = three.map(e => `<button data-id="${e.id}">${esc(e.w)}</button>`).join('');
  const prompts = ['この3語で、ある朝の場面を書いてみよう', 'この3語を、ある人物の一日に入れてみよう', '3語のうち1つを題名にして、短いエッセイを', 'この3語で、手紙の書き出しを考えてみよう', '3語を使って、ふたりの会話を5行で', 'この3語から、歌詞の1フレーズを作ってみよう'];
  $('#ideaPrompt').textContent = prompts[Math.random() * prompts.length | 0];
}
$('#three').onclick = ev => { const b = ev.target.closest('button'); if (b) openSheet(W[+b.dataset.id]); };
$('#reroll').onclick = reroll;
function renderBars(){
  const c = {}; W.forEach(e => { c[e.g || 'そのほか'] = (c[e.g || 'そのほか'] || 0) + 1; (e.x || []).forEach(x => c[x] = (c[x] || 0) + 1); });
  const max = Math.max(...Object.values(c));
  $('#bars').innerHTML = Object.entries(c).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div class="bar"><span>${esc(k)}</span><div class="t"><i style="width:${v / max * 100}%"></i></div><b>${v}</b></div>`).join('');
}

if (location.search.includes('debug')) window.__sj = {W, judgeMean, judgeWord, similar};
renderToday(); render(); go(store.get('tab', 'dict'));
})();
</script>
